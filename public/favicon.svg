<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881324" />
      <stop offset="100%" stop-color="#4A0B14" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#E6B042" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sacred Temple Arch Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Inscription Filigree -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="#C59B27" stroke-width="0.75" stroke-dasharray="2,2" opacity="0.6" />

  <!-- Sacred Kalasam & Temple Sanctum Silhouette -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Top Pinnacle Stupi -->
    <path d="M32 9 L34 14 L30 14 Z" />
    <circle cx="32" cy="15" r="1.8" />
    
    <!-- Kumbham / Pot -->
    <path d="M28 17 C28 16 36 16 36 17 C37 19 39 21 39 24 C39 27 35 29 32 29 C29 29 25 27 25 24 C25 21 27 19 28 17 Z" />
    
    <!-- Lotus Petal Base -->
    <path d="M22 30 C25 28 32 28 32 30 C32 28 39 28 42 30 C44 32 41 34 32 34 C23 34 20 32 22 30 Z" />

    <!-- Auspicious Monogram 'R & K' (Rahul & Kiran) -->
    <text x="32" y="47" font-family="'Cinzel', 'Georgia', serif" font-size="11.5" font-weight="bold" text-anchor="middle" letter-spacing="1" fill="url(#goldGrad)">R&amp;K</text>
    
    <!-- Decorative underline dots -->
    <circle cx="26" cy="52" r="1" opacity="0.8" />
    <polygon points="32,50.5 33.5,52 32,53.5 30.5,52" fill="url(#goldGrad)" />
    <circle cx="38" cy="52" r="1" opacity="0.8" />
  </g>
</svg>
